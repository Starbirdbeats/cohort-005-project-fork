<!doctype html>
<!-- PROTOTYPE — throwaway hi-fi tweaker for Cadence notifications (segments deck + tabbed page).
     Served by hifi-tweaker-server.mjs; each tab's Save writes notification-hifi-tokens.json. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Cadence notifications · hi-fi tweaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" />
<style>

  .tb { font:inherit; font-size:12px; border:1px solid #e3e3e3; background:#fff; border-radius:999px; padding:4px 10px 4px 8px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; color:#333; }
  .tb.on { background:#1a1a1a; color:#fff; border-color:#1a1a1a; }
  .tb .st { width:7px; height:7px; border-radius:50%; background:#d4d4d4; }
  .tb .st.saved { background:#16a34a; } .tb .st.dirty { background:#f59e0b; }
  #controls { flex:1; overflow:auto; padding:6px 18px 12px; }
  .grp { font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:#999; margin:16px 0 6px; }
  .ctl { display:grid; grid-template-columns: 1fr auto; gap:2px 10px; align-items:center; padding:7px 0; border-bottom:1px solid #f3f3f3; }

  .ctl select { font:inherit; font-size:12.5px; border:1px solid #d4d4d4; border-radius:7px; padding:3px 6px; background:#fff; max-width:190px; }
  .ctl input[type=checkbox] { width:16px; height:16px; accent-color:#1a1a1a; }

  .pf { padding:12px 18px 16px; border-top:1px solid #eee; display:flex; gap:8px; align-items:center; }
  .pf button { font:inherit; font-size:13px; border-radius:8px; padding:8px 12px; cursor:pointer; border:1px solid #d4d4d4; background:#fff; }

  .play { font:inherit; font-size:12px; border:1px solid #d4d4d4; background:#fff; border-radius:7px; padding:4px 9px; cursor:pointer; margin:4px 4px 0 0; }

  .note { margin-top:14px; font-size:12px; color:var(--muted-foreground); }

  .btn { border-radius:8px; font:inherit; font-size:13px; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; gap:6px; border:1px solid transparent; transition:opacity 150ms, background-color 150ms; white-space:nowrap; }
  .btn.filled { background:var(--primary); color:var(--primary-foreground); }

  .btn.link { background:none; color:var(--foreground); padding:0 !important; height:auto !important; text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--border); }
  .btn svg.i { width:14px; height:14px; }
  .deck { position:absolute; z-index:20; transform-origin:top right; }
  .deck.enter { animation:pop var(--deck-dur) cubic-bezier(.23,1,.32,1); }
  .deck.leave { animation:popOut 140ms ease-out forwards; }
  .deck.toast-in { animation:toastIn var(--toast-dur) ease; }
  .deck.toast-out { animation:toastOut var(--toast-dur) ease forwards; }
  .card { position:relative; background:var(--popover); }
  .content.in-right { animation:inR var(--flip-dur) cubic-bezier(.23,1,.32,1); }
  .content.in-left { animation:inL var(--flip-dur) cubic-bezier(.23,1,.32,1); }
  .content.in-up { animation:inU 220ms cubic-bezier(.23,1,.32,1); }
  .content.out { animation:out var(--x-dur) ease-out forwards; }
  .tx b { color:var(--foreground); }
  .row { display:flex; align-items:center; cursor:pointer; transition:background-color 150ms; position:relative; }
  .row:hover { background:var(--accent) !important; }
  .tab { cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-weight:500; transition:color 150ms, background-color 150ms; white-space:nowrap; }
  @keyframes pop { from { opacity:0; transform:scale(var(--deck-scale)) translateY(-4px); } }
  @keyframes popOut { to { opacity:0; transform:scale(.97) translateY(-4px); } }
  @keyframes toastIn { from { opacity:0; transform:translateY(calc(var(--toast-drop) * -1)); } }
  @keyframes toastOut { to { opacity:0; transform:translateY(calc(var(--toast-drop) * -1)); } }
  @keyframes inR { from { opacity:0; transform:translateX(var(--flip-d)); } }
  @keyframes inL { from { opacity:0; transform:translateX(calc(var(--flip-d) * -1)); } }
  @keyframes inU { from { opacity:0; transform:translateY(6px); } }
  @keyframes out { to { opacity:0; transform:translateX(16px); } }
  @keyframes dot { from { transform:scale(0); } }

</head>

function renderControls() {
  const t = tabOf(active);
  const extra = active === 'toast' ? `<div><button class="play" data-play="toast">Play toast</button></div><div class="hint">The preview keeps the toast on screen while you tweak. Play shows the real enter, wait and exit.</div>`
    : active === 'motion' ? `<div><button class="play" data-play="open">Replay deck open</button><button class="play" data-play="flip">Flip ›</button><button class="play" data-play="x">Press ×</button></div>` : '';
  document.getElementById('controls').innerHTML = extra + t.controls.map(c => {
    if (c.type === 'group') return `<div class="grp">${c.label}</div>`;
    const changed = V[c.key] !== c.def ? 'changed' : '';
    if (c.type === 'range') return `<div class="ctl ${changed}"><label for="c_${c.key}">${c.label}</label><span class="val" id="v_${c.key}">${fmt(c, V[c.key])}</span><input id="c_${c.key}" data-k="${c.key}" type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${V[c.key]}"></div>`;
    if (c.type === 'select') return `<div class="ctl ${changed}"><label for="c_${c.key}">${c.label}</label><select id="c_${c.key}" data-k="${c.key}">${c.options.map(o => `<option ${o === V[c.key] ? 'selected' : ''}>${o}</option>`).join('')}</select></div>`;
    return `<div class="ctl ${changed}"><label for="c_${c.key}">${c.label}</label><input id="c_${c.key}" data-k="${c.key}" type="checkbox" ${V[c.key] ? 'checked' : ''}></div>`;
  }).join('');
}
function applyTabView() {
  const v = tabOf(active).view;
  P.toast = null;
  if (v === 'page') { P.view = 'page'; P.open = false; }
  else if (v === 'toast') { P.view = 'app'; P.open = false; P.toast = { ...ITEMS[0], id:999, u:1, time:'Just now' }; }
  else { P.view = 'app'; P.open = true; }
  renderPreview();
}
document.getElementById('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  active = b.dataset.tab; document.getElementById('msg').textContent = '';
  renderTabs(); renderControls(); applyTabView();
});
document.getElementById('controls').addEventListener('input', (e) => {
  const k = e.target.dataset.k; if (!k) return;
  const c = tabOf(active).controls.find(x => x.key === k);
  V[k] = c.type === 'range' ? +e.target.value : c.type === 'toggle' ? e.target.checked : e.target.value;
  if (c.type === 'range') document.getElementById('v_' + k).textContent = fmt(c, V[k]);
  e.target.closest('.ctl').classList.toggle('changed', V[k] !== c.def);
  renderTabs(); renderPreview();
});
document.getElementById('controls').addEventListener('click', (e) => {
  const p = e.target.closest('[data-play]'); if (!p) return;
  const what = p.dataset.play;
  if (what === 'toast') playToast();
  if (what === 'open') { P.view = 'app'; P.toast = null; P.open = true; P.anim = { deck:'enter' }; renderPreview(); }
  if (what === 'flip') { if (!P.open) { P.open = true; renderPreview(); } flip(1); }
  if (what === 'x') { if (!P.open) { P.open = true; renderPreview(); } markTop(); }
});
document.getElementById('reset').onclick = () => {
  tabOf(active).controls.forEach(c => { if (c.key) V[c.key] = SAVED[active] && c.key in SAVED[active] ? SAVED[active][c.key] : c.def; });
  document.getElementById('msg').textContent = SAVED[active] ? 'Back to the saved values.' : 'Back to the round 5 defaults.';
  renderControls(); renderTabs(); renderPreview();
};
document.getElementById('save').onclick = async () => {
  const values = tabValues(active), name = tabOf(active).name;
  let ok = false;
  try {
    const r = await fetch(API + '/save', { method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify({ tab: active, name, values }) });
    ok = r.ok; serverOK = ok;
  } catch { serverOK = false; }
  SAVED[active] = values;
  localStorage.setItem('cadence-hifi-saved', JSON.stringify(SAVED));
  document.getElementById('msg').textContent = ok ? `${name} saved to notification-hifi-tokens.json.` : `${name} saved in this browser only. Start the save server to write the file.`;
  renderTabs();
};

document.getElementById('copyall').onclick = async () => {
  const json = JSON.stringify({ tabs: Object.fromEntries(Object.entries(SAVED).map(([id, values]) => [id, { name: tabOf(id) ? tabOf(id).name : id, values }])) }, null, 2);
  try { await navigator.clipboard.writeText(json); document.getElementById('msg').textContent = `Copied ${Object.keys(SAVED).length} saved tab(s). Paste them into the chat.`; }
  catch { document.getElementById('msg').textContent = 'Copy was blocked by the browser.'; }
};

/* ---------- boot: load saved values ---------- */
(async () => {
  let tokens = null, local = {};
  try { const r = await fetch(API + '/tokens'); if (r.ok) { tokens = await r.json(); serverOK = true; } } catch {}
  try { local = JSON.parse(localStorage.getItem('cadence-hifi-saved') || '{}'); } catch {}
  if (tokens && tokens.tabs) {
    Object.entries(tokens.tabs).forEach(([id, t]) => { SAVED[id] = t.values; });
    // Push tabs saved in this browser while the server was unreachable.
    const pending = Object.entries(local).filter(([id]) => !SAVED[id] && tabOf(id));
    for (const [id, values] of pending) {
      try { const r = await fetch(API + '/save', { method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify({ tab:id, name: tabOf(id).name, values }) }); if (r.ok) SAVED[id] = values; } catch {}
    }
    if (pending.length) document.getElementById('msg').textContent = `Synced ${pending.length} tab(s) saved earlier in this browser to notification-hifi-tokens.json.`;
  } else SAVED = local;
  Object.values(SAVED).forEach(vals => Object.assign(V, vals));
  renderTabs(); renderControls(); applyTabView();
})();
</script>
</body>
</html>
